name: recall_app
description: "Synap — A memory engine powered by real spaced repetition."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # Database
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  # Typography
  google_fonts: ^6.2.1
  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.19.1

  # Phase 1 Media & Utilities
  image_picker: ^1.1.2
  audioplayers: ^6.1.0
  file_picker: ^8.1.6
  record: ^7.1.1
  fl_chart: ^0.70.2
  archive: ^4.0.2
  share_plus: ^10.1.4
  http: ^1.2.2
  read_pdf_text: ^0.3.0
  shared_preferences: ^2.3.4
  flutter_markdown: ^0.7.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

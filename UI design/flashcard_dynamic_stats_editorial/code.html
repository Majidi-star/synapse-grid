<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Study Focus - Flashcard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Manrope:wght@300;400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background": "#1c1b16",
                        "inverse-primary": "#735b0c",
                        "on-primary": "#3d2f00",
                        "tertiary-container": "#b9c3ff",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed": "#0a1649",
                        "on-primary-container": "#664f00",
                        "on-primary-fixed": "#241a00",
                        "primary": "#ffdf8c",
                        "on-secondary-fixed-variant": "#484740",
                        "surface-bright": "#3b3934",
                        "on-background": "#e6e1d9",
                        "primary-container": "#e3c36c",
                        "tertiary-fixed": "#dee1ff",
                        "surface-dim": "#15130f",
                        "outline": "#98907f",
                        "surface-container-highest": "#36352f",
                        "tertiary": "#dde0ff",
                        "primary-fixed-dim": "#e3c36c",
                        "surface-container-high": "#2c2a25",
                        "on-surface": "#e6e1d9",
                        "surface-variant": "#36352f",
                        "on-primary-fixed-variant": "#584400",
                        "error-container": "#93000a",
                        "surface-tint": "#e3c36c",
                        "secondary-fixed-dim": "#cac6bd",
                        "surface-container-lowest": "#0f0e0a",
                        "surface-container-low": "#1d1c17",
                        "secondary-container": "#484740",
                        "inverse-on-surface": "#32302b",
                        "surface-container": "#21201b",
                        "on-secondary-fixed": "#1c1c16",
                        "on-tertiary-fixed-variant": "#394377",
                        "on-surface-variant": "#cfc5b3",
                        "primary-fixed": "#ffe08d",
                        "on-secondary-container": "#b8b5ac",
                        "tertiary-fixed-dim": "#b9c3ff",
                        "secondary": "#cac6bd",
                        "surface": "#1c1b16",
                        "on-error": "#690005",
                        "outline-variant": "#4c4638",
                        "on-tertiary": "#222c5f",
                        "on-tertiary-container": "#454f83",
                        "error": "#ffb4ab",
                        "on-secondary": "#32302a",
                        "secondary-fixed": "#e6e2d9",
                        "inverse-surface": "#e7e2da"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "stack-lg": "48px",
                        "margin-page": "32px",
                        "stack-sm": "12px",
                        "gutter-inline": "24px",
                        "card-padding": "48px",
                        "stack-md": "24px"
                    },
                    fontFamily: {
                        "label-sm": ["Geist"],
                        "body-md": ["Manrope"],
                        "label-md": ["Geist"],
                        "headline-sm": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "display-lg": ["Manrope"],
                        "headline-md": ["Manrope"]
                    },
                    fontSize: {
                        "label-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }],
                        "body-md": ["16px", { lineHeight: "28px", fontWeight: "300" }],
                        "label-md": ["13px", { lineHeight: "20px", letterSpacing: "0.08em", fontWeight: "400" }],
                        "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "400", letterSpacing: "0.02em" }],
                        "body-lg": ["18px", { lineHeight: "32px", fontWeight: "300" }],
                        "display-lg": ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "300" }],
                        "headline-md": ["28px", { lineHeight: "36px", letterSpacing: "-0.01em", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #1c1b16; color: #e6e1d9; }
        .perspective-1000 { perspective: 1200px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .flashcard-transition { transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-body-md overflow-x-hidden selection:bg-[#e3c36c] selection:text-[#1c1b16]">
<!-- TopAppBar -->
<header class="bg-transparent flex justify-between items-center px-margin-page h-20 w-full z-40 sticky top-0">
<button class="p-2 -ml-2 rounded-full hover:opacity-70 transition-opacity flex items-center justify-center text-[#e6e1d9]/70">
<span class="material-symbols-outlined font-light" data-icon="menu">menu</span>
</button>
<div class="text-center">
<h1 class="font-headline-sm text-headline-sm text-[#e6e1d9]">Study Focus</h1>
</div>
<button class="p-2 -mr-2 rounded-full hover:opacity-70 transition-opacity flex items-center justify-center text-[#e6e1d9]/70">
<span class="material-symbols-outlined font-light" data-icon="settings">settings</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-page py-stack-md pb-32">
<!-- Progress Indicator -->
<div class="w-full max-w-[340px] mb-stack-md">
<div class="flex justify-between items-center mb-4">
<span class="font-label-sm text-label-sm text-[#e6e1d9]/60 tracking-wider uppercase">Geography 101</span>
<span class="font-label-sm text-label-sm text-[#e6e1d9]/60 tracking-wider">12 / 50</span>
</div>
<div class="h-[1px] bg-[#e6e1d9]/10 w-full overflow-hidden">
<div class="h-full bg-[#e3c36c] w-[24%] transition-all duration-700 ease-in-out"></div>
</div>
</div>
<!-- Flashcard Container -->
<div class="w-full max-w-[340px] aspect-[3/4] perspective-1000 group relative z-10 cursor-pointer mt-8" onclick="this.querySelector('.flashcard-inner').classList.toggle('rotate-y-180')">
<!-- Inner card handling 3D -->
<div class="flashcard-inner w-full h-full relative transform-style-3d flashcard-transition rounded-2xl">
<!-- Front Side -->
<div class="absolute inset-0 backface-hidden bg-[#1c1b16] border border-[#e6e1d9]/10 rounded-2xl p-card-padding flex flex-col justify-center items-center text-center shadow-2xl shadow-black/40">
<p class="font-display-lg text-display-lg text-[#e6e1d9] leading-tight mb-8">What is the capital of France?</p>
<span class="font-label-md text-label-md text-[#e3c36c]/70 uppercase tracking-widest absolute bottom-8">Tap to reveal</span>
</div>
<!-- Back Side -->
<div class="absolute inset-0 backface-hidden rotate-y-180 bg-[#1c1b16] border border-[#e3c36c]/30 rounded-2xl p-card-padding flex flex-col justify-center items-center text-center shadow-2xl shadow-[#e3c36c]/5">
<p class="font-display-lg text-display-lg text-[#e3c36c] mb-12">Paris</p>
<!-- Confidence Rating (Visible on back) -->
<div class="absolute bottom-8 w-full px-6 flex justify-between gap-4">
<button class="flex-1 py-3 border border-[#e6e1d9]/10 rounded-lg text-[#e6e1d9]/80 font-label-md text-label-md hover:bg-[#e6e1d9]/5 transition-colors uppercase tracking-widest" onclick="event.stopPropagation()">Hard</button>
<button class="flex-1 py-3 border border-[#e6e1d9]/20 rounded-lg text-[#e6e1d9] font-label-md text-label-md hover:bg-[#e6e1d9]/10 transition-colors uppercase tracking-widest" onclick="event.stopPropagation()">Good</button>
<button class="flex-1 py-3 bg-[#e3c36c]/10 border border-[#e3c36c]/40 rounded-lg text-[#e3c36c] font-label-md text-label-md hover:bg-[#e3c36c]/20 transition-colors uppercase tracking-widest" onclick="event.stopPropagation()">Easy</button>
</div>
</div>
</div>
</div>
<!-- Bottom Actions -->
<div class="w-full max-w-[340px] mt-12 flex flex-col gap-8">
<!-- Mastery Overview -->
<div class="flex flex-col gap-4">
<h3 class="font-label-md text-label-md text-[#e6e1d9]/60 uppercase tracking-widest">Mastery Overview</h3>
<div class="flex justify-between items-center">
<div class="flex flex-col items-center gap-2">
<div class="w-14 h-14 rounded-full border-2 border-[#b9c3ff]/30 flex items-center justify-center relative">
<svg class="absolute inset-0 w-full h-full -rotate-90">
<circle cx="28" cy="28" fill="none" r="24" stroke="#b9c3ff" stroke-dasharray="150" stroke-dashoffset="45" stroke-linecap="round" stroke-width="2"></circle>
</svg>
<span class="font-label-sm text-[10px] text-[#b9c3ff]">70%</span>
</div>
<span class="font-label-sm text-[10px] text-[#e6e1d9]/50 uppercase tracking-wider">Learning</span>
</div>
<div class="flex flex-col items-center gap-2">
<div class="w-14 h-14 rounded-full border-2 border-[#e3c36c]/30 flex items-center justify-center relative">
<svg class="absolute inset-0 w-full h-full -rotate-90">
<circle cx="28" cy="28" fill="none" r="24" stroke="#e3c36c" stroke-dasharray="150" stroke-dashoffset="90" stroke-linecap="round" stroke-width="2"></circle>
</svg>
<span class="font-label-sm text-[10px] text-[#e3c36c]">40%</span>
</div>
<span class="font-label-sm text-[10px] text-[#e6e1d9]/50 uppercase tracking-wider">Review</span>
</div>
<div class="flex flex-col items-center gap-2">
<div class="w-14 h-14 rounded-full border-2 border-[#cac6bd]/30 flex items-center justify-center relative">
<svg class="absolute inset-0 w-full h-full -rotate-90">
<circle cx="28" cy="28" fill="none" r="24" stroke="#cac6bd" stroke-dasharray="150" stroke-dashoffset="120" stroke-linecap="round" stroke-width="2"></circle>
</svg>
<span class="font-label-sm text-[10px] text-[#cac6bd]">20%</span>
</div>
<span class="font-label-sm text-[10px] text-[#e6e1d9]/50 uppercase tracking-wider">Mastered</span>
</div>
</div>
</div>
<!-- Retention Trend -->
<div class="flex flex-col gap-4">
<div class="flex justify-between items-center">
<h3 class="font-label-md text-label-md text-[#e6e1d9]/60 uppercase tracking-widest">Retention Trend</h3>
<div class="flex items-center gap-1 text-[#e3c36c]">
<span class="material-symbols-outlined text-lg">local_fire_department</span>
<span class="font-label-sm text-label-sm">12 Day Streak</span>
</div>
</div>
<div class="h-24 w-full relative flex items-end">
<svg class="w-full h-full" preserveaspectratio="none" viewbox="0 0 340 100">
<path d="M0,80 Q40,70 80,85 T160,40 T240,60 T340,20" fill="none" stroke="#ffb4ab" stroke-linecap="round" stroke-width="2"></path>
</svg>
</div>
</div>
<!-- Daily Activity -->
<div class="flex flex-col gap-4">
<h3 class="font-label-md text-label-md text-[#e6e1d9]/60 uppercase tracking-widest">Daily Activity</h3>
<div class="flex justify-between items-end h-16 gap-2">
<div class="flex-1 bg-[#b9c3ff]/20 rounded-t-sm h-[40%]"></div>
<div class="flex-1 bg-[#b9c3ff]/20 rounded-t-sm h-[60%]"></div>
<div class="flex-1 bg-[#b9c3ff]/20 rounded-t-sm h-[30%]"></div>
<div class="flex-1 bg-[#b9c3ff]/20 rounded-t-sm h-[85%]"></div>
<div class="flex-1 bg-[#b9c3ff]/20 rounded-t-sm h-[50%]"></div>
<div class="flex-1 bg-[#b9c3ff]/20 rounded-t-sm h-[70%]"></div>
<div class="flex-1 bg-[#b9c3ff] rounded-t-sm h-[95%]"></div>
</div>
<div class="flex justify-between text-[10px] text-[#e6e1d9]/40 uppercase tracking-tighter">
<span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="bg-transparent fixed bottom-0 w-full z-50 md:hidden bg-gradient-to-t from-[#1c1b16] via-[#1c1b16]/90 to-transparent pt-8 pb-4">
<div class="w-full z-50 flex justify-center gap-16 items-center px-gutter-inline pb-safe">
<!-- Decks (Active) -->
<button class="flex flex-col items-center justify-center text-[#e3c36c] transition-all duration-300">
<span class="material-symbols-outlined font-light text-2xl mb-1" data-icon="style">style</span>
<span class="font-label-sm text-[10px] tracking-widest uppercase opacity-80">Decks</span>
</button>
<!-- Library -->
<button class="flex flex-col items-center justify-center text-[#e6e1d9]/40 hover:text-[#e6e1d9] transition-all duration-300">
<span class="material-symbols-outlined font-light text-2xl mb-1" data-icon="import_contacts">import_contacts</span>
<span class="font-label-sm text-[10px] tracking-widest uppercase opacity-80">Library</span>
</button>
<!-- Profile -->
<button class="flex flex-col items-center justify-center text-[#e6e1d9]/40 hover:text-[#e6e1d9] transition-all duration-300">
<span class="material-symbols-outlined font-light text-2xl mb-1" data-icon="person">person</span>
<span class="font-label-sm text-[10px] tracking-widest uppercase opacity-80">Profile</span>
</button>
</div>
</nav>
<!-- Desktop Sidebar Placeholder (Hidden on Mobile) -->
<aside class="hidden md:flex bg-[#1c1b16] border-r border-[#e6e1d9]/5 h-full w-80 flex-col p-stack-lg fixed left-0 top-0 z-50">
<div class="flex items-center gap-4 mb-stack-lg mt-4">
<div class="w-10 h-10 rounded-full border border-[#e3c36c]/40 flex items-center justify-center text-[#e3c36c] font-light text-lg">A</div>
<div>
<h2 class="font-headline-sm text-headline-sm text-[#e6e1d9]">Alex Learner</h2>
<p class="font-label-sm text-label-sm text-[#e6e1d9]/50 tracking-wider">128 Cards Mastered</p>
</div>
</div>
<nav class="flex flex-col gap-6 mt-8">
<button class="text-[#e3c36c] font-label-md tracking-widest uppercase flex items-center gap-4 text-left w-full transition-all">
<span class="material-symbols-outlined font-light" data-icon="folder">folder</span>
                All Decks
            </button>
<button class="text-[#e6e1d9]/60 hover:text-[#e6e1d9] font-label-md tracking-widest uppercase flex items-center gap-4 text-left w-full transition-all">
<span class="material-symbols-outlined font-light" data-icon="star">star</span>
                Starred
            </button>
<button class="text-[#e6e1d9]/60 hover:text-[#e6e1d9] font-label-md tracking-widest uppercase flex items-center gap-4 text-left w-full transition-all">
<span class="material-symbols-outlined font-light" data-icon="history">history</span>
                Recent
            </button>
<button class="text-[#e6e1d9]/60 hover:text-[#e6e1d9] font-label-md tracking-widest uppercase flex items-center gap-4 text-left w-full transition-all mt-auto mb-8">
<span class="material-symbols-outlined font-light" data-icon="settings">settings</span>
                Settings
            </button>
</nav>
</aside>
</body></html>
